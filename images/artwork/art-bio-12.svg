<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="artBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="60%" stop-color="#FB8500" />
      <stop offset="100%" stop-color="#023047" />
    </linearGradient>
    <linearGradient id="artAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#219EBC" />
      <stop offset="100%" stop-color="#8ECAE6" />
    </linearGradient>
    <radialGradient id="nebulaSun" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#219EBC" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#8ECAE6" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#FB8500" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFB703" stop-opacity="0"/>
    </radialGradient>
    <filter id="artGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#artBgGrad)" />
  
  <!-- Outer Poster Border -->
  <rect x="24" y="24" width="552" height="752" rx="16" fill="none" stroke="#219EBC" stroke-width="3" opacity="0.65"/>
  <rect x="32" y="32" width="536" height="736" rx="12" fill="none" stroke="#023047" stroke-width="1" opacity="0.4"/>
  
  <!-- Grand Sun / Celestial Center Glow -->
  <circle cx="300" cy="300" r="220" fill="url(#nebulaSun)" />

  <!-- Bio-Art & Natural Wonders Composition -->
  <g>
    <!-- Giant Fibonacci Nautilus / Organic Spiral -->
    <path d="M300,320 C320,320 330,310 330,290 C330,260 305,240 270,240 C220,240 185,280 185,340 C185,420 245,480 335,480 C445,480 520,390 520,270 C520,130 400,40 250,40 C80,40 -20,165 -20,340" fill="none" stroke="url(#artAccent)" stroke-width="8" stroke-linecap="round" filter="url(#artGlow)"/>
    
    <!-- Cellular Micro-Spheres & Crystal Facets -->
    <circle cx="300" cy="300" r="45" fill="#219EBC" opacity="0.8" filter="url(#artGlow)"/>
    <circle cx="210" cy="240" r="28" fill="#023047" opacity="0.7"/>
    <circle cx="390" cy="220" r="32" fill="#8ECAE6" opacity="0.75"/>
    <circle cx="350" cy="400" r="36" fill="#219EBC" opacity="0.6"/>
    <circle cx="190" cy="380" r="24" fill="#023047" opacity="0.8"/>
  </g>

  <!-- Poster Typography Banner -->
  <g>
    <rect x="50" y="600" width="500" height="135" rx="16" fill="#FFB703" stroke="#219EBC" stroke-width="2" />
    <text x="300" y="642" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="20" fill="#219EBC" text-anchor="middle" letter-spacing="1">
      POLLEN GRAIN COSMIC SPHERES UNDE
    </text>
    <text x="300" y="668" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#023047" text-anchor="middle" letter-spacing="3">
      BIO-ART & MICROSCOPIC WONDERS
    </text>
    <line x1="120" y1="685" x2="480" y2="685" stroke="#8ECAE6" stroke-width="1.5" opacity="0.6"/>
    <text x="300" y="710" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#FFFFFF" text-anchor="middle" opacity="0.85">
      Elementary School STEAM Lab • Inspiring Awe &amp; Wonder
    </text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="artBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000814" />
      <stop offset="60%" stop-color="#001D3D" />
      <stop offset="100%" stop-color="#003566" />
    </linearGradient>
    <linearGradient id="artAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>
    <radialGradient id="nebulaSun" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#00F5D4" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#001D3D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000814" stop-opacity="0"/>
    </radialGradient>
    <filter id="artGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#artBgGrad)" />
  
  <!-- Outer Poster Border -->
  <rect x="24" y="24" width="552" height="752" rx="16" fill="none" stroke="#7B2CBF" stroke-width="3" opacity="0.65"/>
  <rect x="32" y="32" width="536" height="736" rx="12" fill="none" stroke="#003566" stroke-width="1" opacity="0.4"/>
  
  <!-- Grand Sun / Celestial Center Glow -->
  <circle cx="300" cy="300" r="220" fill="url(#nebulaSun)" />

  <!-- Historical Pioneer & STEAM Hero Iconography -->
  <g>
    <!-- Glowing Halo of Knowledge -->
    <circle cx="300" cy="280" r="140" fill="url(#artAccent)" opacity="0.85" filter="url(#artGlow)"/>
    
    <!-- Hero Bust Silhouette -->
    <path d="M300,180 C260,180 235,215 235,260 C235,305 260,340 300,340 C340,340 365,305 365,260 C365,215 340,180 300,180 Z M180,480 C180,410 240,370 300,370 C360,370 420,410 420,480 Z" fill="#000814"/>
    
    <!-- Radiating Ideas & Formulas -->
    <circle cx="300" cy="280" r="170" fill="none" stroke="#7B2CBF" stroke-width="3" stroke-dasharray="12 8"/>
    <circle cx="210" cy="180" r="16" fill="#00F5D4" filter="url(#artGlow)"/>
    <circle cx="390" cy="180" r="16" fill="#003566" filter="url(#artGlow)"/>
    <circle cx="160" cy="310" r="12" fill="#7B2CBF"/>
    <circle cx="440" cy="310" r="12" fill="#00F5D4"/>
  </g>

  <!-- Poster Typography Banner -->
  <g>
    <rect x="50" y="600" width="500" height="135" rx="16" fill="#000814" stroke="#7B2CBF" stroke-width="2" />
    <text x="300" y="642" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="20" fill="#7B2CBF" text-anchor="middle" letter-spacing="1">
      STEPHEN HAWKING: A BRIEF HISTORY
    </text>
    <text x="300" y="668" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#003566" text-anchor="middle" letter-spacing="3">
      HISTORICAL STEAM HEROES & PIONEERS
    </text>
    <line x1="120" y1="685" x2="480" y2="685" stroke="#00F5D4" stroke-width="1.5" opacity="0.6"/>
    <text x="300" y="710" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#FFFFFF" text-anchor="middle" opacity="0.85">
      Elementary School STEAM Lab • Inspiring Awe &amp; Wonder
    </text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="artBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0000" />
      <stop offset="60%" stop-color="#FF5400" />
      <stop offset="100%" stop-color="#FFBD00" />
    </linearGradient>
    <linearGradient id="artAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#390099" />
      <stop offset="100%" stop-color="#9E0059" />
    </linearGradient>
    <radialGradient id="nebulaSun" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#390099" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#9E0059" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#FF5400" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF0000" stop-opacity="0"/>
    </radialGradient>
    <filter id="artGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#artBgGrad)" />
  
  <!-- Outer Poster Border -->
  <rect x="24" y="24" width="552" height="752" rx="16" fill="none" stroke="#390099" stroke-width="3" opacity="0.65"/>
  <rect x="32" y="32" width="536" height="736" rx="12" fill="none" stroke="#FFBD00" stroke-width="1" opacity="0.4"/>
  
  <!-- Grand Sun / Celestial Center Glow -->
  <circle cx="300" cy="300" r="220" fill="url(#nebulaSun)" />

  <!-- Cosmic Landscape / Exoplanet Horizons -->
  <g>
    <!-- Distant Mountain Ridges & Craters -->
    <polygon points="40,550 180,380 320,550" fill="#FF5400" opacity="0.7"/>
    <polygon points="220,550 380,340 560,550" fill="#FF0000" opacity="0.9"/>
    <polygon points="120,560 280,420 460,560" fill="#9E0059" opacity="0.4"/>
    
    <!-- Planetary Rings Across Sky -->
    <ellipse cx="300" cy="260" rx="260" ry="70" fill="none" stroke="url(#artAccent)" stroke-width="8" transform="rotate(-15 300 260)" filter="url(#artGlow)"/>
    <ellipse cx="300" cy="260" rx="280" ry="60" fill="none" stroke="#390099" stroke-width="2" stroke-dasharray="8 6" transform="rotate(-15 300 260)"/>
    
    <!-- Giant Glowing Celestial Body -->
    <circle cx="300" cy="240" r="85" fill="url(#artAccent)" filter="url(#artGlow)"/>
    <circle cx="280" cy="220" r="70" fill="#FF0000" opacity="0.3"/>
    
    <!-- Retro Sci-Fi Explorer / Rover Silhouette -->
    <rect x="260" y="500" width="80" height="35" rx="8" fill="#390099" filter="url(#artGlow)"/>
    <circle cx="280" cy="535" r="14" fill="#FF0000" stroke="#390099" stroke-width="3"/>
    <circle cx="320" cy="535" r="14" fill="#FF0000" stroke="#390099" stroke-width="3"/>
    <line x1="300" y1="500" x2="300" y2="470" stroke="#390099" stroke-width="3"/>
    <circle cx="300" cy="465" r="6" fill="#9E0059"/>
    
    <!-- Star Spangles -->
    <circle cx="100" cy="120" r="4" fill="#FFFFFF" filter="url(#artGlow)"/>
    <circle cx="480" cy="110" r="5" fill="#390099" filter="url(#artGlow)"/>
    <circle cx="510" cy="200" r="3" fill="#FFFFFF"/>
    <circle cx="80" cy="240" r="4" fill="#FFBD00"/>
  </g>

  <!-- Poster Typography Banner -->
  <g>
    <rect x="50" y="600" width="500" height="135" rx="16" fill="#FF0000" stroke="#390099" stroke-width="2" />
    <text x="300" y="642" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="20" fill="#390099" text-anchor="middle" letter-spacing="1">
      JPL: 51 PEGASI B - THE FIRST EXO
    </text>
    <text x="300" y="668" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFBD00" text-anchor="middle" letter-spacing="3">
      COSMIC WONDER & SPACE POSTERS
    </text>
    <line x1="120" y1="685" x2="480" y2="685" stroke="#9E0059" stroke-width="1.5" opacity="0.6"/>
    <text x="300" y="710" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#FFFFFF" text-anchor="middle" opacity="0.85">
      Elementary School STEAM Lab • Inspiring Awe &amp; Wonder
    </text>
  </g>
</svg>
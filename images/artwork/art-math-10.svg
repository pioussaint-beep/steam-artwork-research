<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="artBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#264653" />
      <stop offset="60%" stop-color="#2A9D8F" />
      <stop offset="100%" stop-color="#E9C46A" />
    </linearGradient>
    <linearGradient id="artAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A261" />
      <stop offset="100%" stop-color="#E76F51" />
    </linearGradient>
    <radialGradient id="nebulaSun" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F4A261" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#E76F51" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#2A9D8F" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#264653" stop-opacity="0"/>
    </radialGradient>
    <filter id="artGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#artBgGrad)" />
  
  <!-- Outer Poster Border -->
  <rect x="24" y="24" width="552" height="752" rx="16" fill="none" stroke="#F4A261" stroke-width="3" opacity="0.65"/>
  <rect x="32" y="32" width="536" height="736" rx="12" fill="none" stroke="#E9C46A" stroke-width="1" opacity="0.4"/>
  
  <!-- Grand Sun / Celestial Center Glow -->
  <circle cx="300" cy="300" r="220" fill="url(#nebulaSun)" />

  <!-- Generative Math & Fractal Geometry Composition -->
  <g transform="translate(300, 320)">
    <!-- Concentric Harmonic Spirograph Rings -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#F4A261" stroke-width="3" stroke-dasharray="10 8" filter="url(#artGlow)"/>
    <ellipse cx="0" cy="0" rx="170" ry="70" fill="none" stroke="#E9C46A" stroke-width="4" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="170" ry="70" fill="none" stroke="#F4A261" stroke-width="4" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="170" ry="70" fill="none" stroke="#E76F51" stroke-width="4" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="170" ry="70" fill="none" stroke="#E9C46A" stroke-width="4" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="170" ry="70" fill="none" stroke="#F4A261" stroke-width="4" transform="rotate(120)"/>
    <ellipse cx="0" cy="0" rx="170" ry="70" fill="none" stroke="#E76F51" stroke-width="4" transform="rotate(150)"/>
    
    <!-- Central Golden Core -->
    <circle cx="0" cy="0" r="35" fill="url(#artAccent)" filter="url(#artGlow)"/>
    <circle cx="0" cy="0" r="14" fill="#264653"/>
  </g>

  <!-- Poster Typography Banner -->
  <g>
    <rect x="50" y="600" width="500" height="135" rx="16" fill="#264653" stroke="#F4A261" stroke-width="2" />
    <text x="300" y="642" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="20" fill="#F4A261" text-anchor="middle" letter-spacing="1">
      HEXAGONAL VORONOI DIAGRAM LANDSC
    </text>
    <text x="300" y="668" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#E9C46A" text-anchor="middle" letter-spacing="3">
      GENERATIVE MATH & OPTICAL WONDERS
    </text>
    <line x1="120" y1="685" x2="480" y2="685" stroke="#E76F51" stroke-width="1.5" opacity="0.6"/>
    <text x="300" y="710" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#FFFFFF" text-anchor="middle" opacity="0.85">
      Elementary School STEAM Lab • Inspiring Awe &amp; Wonder
    </text>
  </g>
</svg>
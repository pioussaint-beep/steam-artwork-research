<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="artBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="60%" stop-color="#40916C" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>
    <linearGradient id="artAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8F3DC" />
      <stop offset="100%" stop-color="#FFB703" />
    </linearGradient>
    <radialGradient id="nebulaSun" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#D8F3DC" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FFB703" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#40916C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2D6A4F" stop-opacity="0"/>
    </radialGradient>
    <filter id="artGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#artBgGrad)" />
  
  <!-- Outer Poster Border -->
  <rect x="24" y="24" width="552" height="752" rx="16" fill="none" stroke="#D8F3DC" stroke-width="3" opacity="0.65"/>
  <rect x="32" y="32" width="536" height="736" rx="12" fill="none" stroke="#52B788" stroke-width="1" opacity="0.4"/>
  
  <!-- Grand Sun / Celestial Center Glow -->
  <circle cx="300" cy="300" r="220" fill="url(#nebulaSun)" />

  <!-- Wall Mural & Architecture Composition -->
  <g>
    <!-- Isometric Blocks & Maker City -->
    <polygon points="300,160 460,240 300,320 140,240" fill="url(#artAccent)" filter="url(#artGlow)"/>
    <polygon points="140,240 300,320 300,480 140,400" fill="#2D6A4F" opacity="0.85"/>
    <polygon points="460,240 300,320 300,480 460,400" fill="#40916C" opacity="0.95"/>
    
    <!-- Giant Gear & Kinetic Motion -->
    <g transform="translate(300, 320)" opacity="0.9">
      <circle cx="0" cy="0" r="110" fill="none" stroke="#D8F3DC" stroke-width="16" stroke-dasharray="24 16" filter="url(#artGlow)"/>
      <circle cx="0" cy="0" r="60" fill="none" stroke="#52B788" stroke-width="6"/>
      <circle cx="0" cy="0" r="25" fill="#FFB703"/>
    </g>
    
    <!-- Sprouting Tree Roots / Circuit Flow -->
    <path d="M140,400 Q200,500 240,560 M460,400 Q400,500 360,560 M300,480 L300,560" stroke="#D8F3DC" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#artGlow)"/>
  </g>

  <!-- Poster Typography Banner -->
  <g>
    <rect x="50" y="600" width="500" height="135" rx="16" fill="#2D6A4F" stroke="#D8F3DC" stroke-width="2" />
    <text x="300" y="642" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="20" fill="#D8F3DC" text-anchor="middle" letter-spacing="1">
      THE GREAT TREE OF KNOWLEDGE & TE
    </text>
    <text x="300" y="668" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#52B788" text-anchor="middle" letter-spacing="3">
      STEAM WALL MURALS & LAB ART
    </text>
    <line x1="120" y1="685" x2="480" y2="685" stroke="#FFB703" stroke-width="1.5" opacity="0.6"/>
    <text x="300" y="710" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#FFFFFF" text-anchor="middle" opacity="0.85">
      Elementary School STEAM Lab • Inspiring Awe &amp; Wonder
    </text>
  </g>
</svg>
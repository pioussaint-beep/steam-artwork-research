<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74C69D" />
      <stop offset="50%" stop-color="#D8F3DC" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8F3DC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#74C69D" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D8F3DC" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FFD166" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2D6A4F" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="48" fill="url(#bgGrad)" />
  <circle cx="256" cy="230" r="160" fill="url(#sunGlow)" />
  
  <!-- Outer Tech / Geometric Frame -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#74C69D" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="256" cy="230" r="185" fill="none" stroke="#D8F3DC" stroke-width="1.5" opacity="0.4"/>

  <!-- Gear & Tinkering Elements -->
  <g filter="url(#softShadow)">
    <!-- Central Large Gear -->
    <g transform="translate(256, 220)" filter="url(#neonGlow)">
      <circle cx="0" cy="0" r="75" fill="url(#accentGrad)"/>
      <circle cx="0" cy="0" r="35" fill="#2D6A4F" stroke="#D8F3DC" stroke-width="4"/>
      <!-- Gear Teeth -->
      <path d="M-15,-90 L15,-90 L12,-70 L-12,-70 Z M-90,-15 L-90,15 L-70,12 L-70,-12 Z M-15,70 L15,70 L12,90 L-12,90 Z M70,-15 L70,15 L90,12 L90,-12 Z" fill="#74C69D"/>
      <path d="M-60,-60 L-40,-75 L-30,-55 L-50,-40 Z M60,-60 L40,-75 L30,-55 L50,-40 Z M-60,60 L-40,75 L-30,55 L-50,40 Z M60,60 L40,75 L30,55 L50,40 Z" fill="#74C69D"/>
    </g>
    <!-- Secondary Interlocking Gear -->
    <g transform="translate(340, 150) rotate(15)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="#D8F3DC" stroke-width="12" stroke-dasharray="14 10"/>
      <circle cx="0" cy="0" r="20" fill="#52B788" stroke="#FFD166" stroke-width="3"/>
    </g>
    <!-- Sprouting Lightbulb / Spark Core -->
    <path d="M256,150 Q280,180 270,210 L242,210 Q232,180 256,150 Z" fill="#D8F3DC" opacity="0.85" filter="url(#neonGlow)"/>
    <line x1="256" y1="130" x2="256" y2="105" stroke="#D8F3DC" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>
    <line x1="220" y1="140" x2="200" y2="125" stroke="#D8F3DC" stroke-width="4" stroke-linecap="round"/>
    <line x1="292" y1="140" x2="312" y2="125" stroke="#D8F3DC" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Bottom Text Banner -->
  <g filter="url(#softShadow)">
    <rect x="40" y="405" width="432" height="68" rx="20" fill="#2D6A4F" stroke="url(#accentGrad)" stroke-width="2.5" />
    <text x="256" y="445" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="20" fill="#D8F3DC" text-anchor="middle" letter-spacing="1.5">
      SPROUTING IDEA BULB LAB
    </text>
    <text x="256" y="464" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#74C69D" text-anchor="middle" letter-spacing="3" opacity="0.9">
      GEARS, LIGHTBULBS & TINKERING
    </text>
  </g>
</svg>
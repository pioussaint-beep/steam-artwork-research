<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240046" />
      <stop offset="100%" stop-color="#3C096C" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A189A" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#E0AAFF" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5A189A" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#E0AAFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#240046" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="48" fill="url(#bgGrad)" />
  <circle cx="256" cy="230" r="160" fill="url(#sunGlow)" />
  
  <!-- Outer Tech / Geometric Frame -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#5A189A" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="256" cy="230" r="185" fill="none" stroke="#7B2CBF" stroke-width="1.5" opacity="0.4"/>

  <!-- Nature & Bio-Tech Elements -->
  <g filter="url(#softShadow)" transform="translate(256, 220)">
    <!-- Split Biomimicry Butterfly / Leaf Wings -->
    <!-- Left Wing (Organic) -->
    <path d="M0,-10 C-40,-90 -140,-80 -130,0 C-125,50 -60,90 0,60 Z" fill="url(#accentGrad)" filter="url(#neonGlow)" opacity="0.9"/>
    <!-- Right Wing (Circuit Tech) -->
    <path d="M0,-10 C40,-90 140,-80 130,0 C125,50 60,90 0,60 Z" fill="#240046" stroke="#7B2CBF" stroke-width="4"/>
    <!-- Circuit Lines on Right Wing -->
    <path d="M20,0 L60,-20 L90,-20 M40,20 L80,30 L100,10 M30,-40 L70,-60" fill="none" stroke="#5A189A" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="90" cy="-20" r="5" fill="#7B2CBF" filter="url(#neonGlow)"/>
    <circle cx="100" cy="10" r="5" fill="#E0AAFF"/>
    <circle cx="70" cy="-60" r="5" fill="#7B2CBF"/>
    
    <!-- Central Body Seed / Chrysalis -->
    <ellipse cx="0" cy="20" rx="14" ry="45" fill="#7B2CBF" filter="url(#neonGlow)"/>
    <circle cx="0" cy="-30" r="12" fill="#E0AAFF"/>
    <line x1="-5" y1="-40" x2="-25" y2="-70" stroke="#5A189A" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="-40" x2="25" y2="-70" stroke="#5A189A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom Text Banner -->
  <g filter="url(#softShadow)">
    <rect x="40" y="405" width="432" height="68" rx="20" fill="#240046" stroke="url(#accentGrad)" stroke-width="2.5" />
    <text x="256" y="445" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="20" fill="#7B2CBF" text-anchor="middle" letter-spacing="1.5">
      CRYSTALLINE CAVE GEO-LAB
    </text>
    <text x="256" y="464" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#5A189A" text-anchor="middle" letter-spacing="3" opacity="0.9">
      NATURE & BIO-TECH
    </text>
  </g>
</svg>
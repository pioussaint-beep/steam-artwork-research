<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74C69D" />
      <stop offset="50%" stop-color="#D8F3DC" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8F3DC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#74C69D" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D8F3DC" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#1B4332" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2D6A4F" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="48" fill="url(#bgGrad)" />
  <circle cx="256" cy="230" r="160" fill="url(#sunGlow)" />
  
  <!-- Outer Tech / Geometric Frame -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#74C69D" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="256" cy="230" r="185" fill="none" stroke="#D8F3DC" stroke-width="1.5" opacity="0.4"/>

  <!-- General Renowned STEAM Crest -->
  <g filter="url(#softShadow)" transform="translate(256, 220)">
    <!-- Hexagonal Honeycomb Core -->
    <polygon points="0,-100 86,-50 86,50 0,100 -86,50 -86,-50" fill="url(#accentGrad)" stroke="#D8F3DC" stroke-width="5" filter="url(#neonGlow)"/>
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="#2D6A4F" stroke="#74C69D" stroke-width="2"/>
    
    <!-- Central Golden Spark / Atom -->
    <circle cx="0" cy="0" r="24" fill="#D8F3DC" filter="url(#neonGlow)"/>
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="#74C69D" stroke-width="3" transform="rotate(45 0 0)"/>
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="#1B4332" stroke-width="3" transform="rotate(-45 0 0)"/>
    <circle cx="38" cy="38" r="5" fill="#FFFFFF"/>
    <circle cx="-38" cy="38" r="5" fill="#D8F3DC"/>
  </g>

  <!-- Bottom Text Banner -->
  <g filter="url(#softShadow)">
    <rect x="40" y="405" width="432" height="68" rx="20" fill="#2D6A4F" stroke="url(#accentGrad)" stroke-width="2.5" />
    <text x="256" y="445" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="20" fill="#D8F3DC" text-anchor="middle" letter-spacing="1.5">
      PINECREST ELEMENTARY GREEN
    </text>
    <text x="256" y="464" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#74C69D" text-anchor="middle" letter-spacing="3" opacity="0.9">
      RENOWNED REAL-WORLD LABS
    </text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D90429" />
      <stop offset="100%" stop-color="#FF006E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8338EC" />
      <stop offset="50%" stop-color="#3A86FF" />
      <stop offset="100%" stop-color="#FFBE0B" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A86FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8338EC" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A86FF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FFBE0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D90429" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="48" fill="url(#bgGrad)" />
  <circle cx="256" cy="230" r="160" fill="url(#sunGlow)" />
  
  <!-- Outer Tech / Geometric Frame -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#8338EC" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="256" cy="230" r="185" fill="none" stroke="#3A86FF" stroke-width="1.5" opacity="0.4"/>

  <!-- Integrated Typography / Shield Monogram -->
  <g filter="url(#softShadow)" transform="translate(256, 215)">
    <!-- Crest Shield Frame -->
    <path d="M-100,-80 L100,-80 L100,20 Q100,110 0,140 Q-100,110 -100,20 Z" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="6" filter="url(#neonGlow)"/>
    
    <!-- 4 Quadrant Grid -->
    <line x1="-95" y1="20" x2="95" y2="20" stroke="#8338EC" stroke-width="3" stroke-dasharray="5 5" opacity="0.6"/>
    <line x1="0" y1="-75" x2="0" y2="130" stroke="#8338EC" stroke-width="3" stroke-dasharray="5 5" opacity="0.6"/>
    
    <!-- 4 Quadrant STEAM Mini Icons -->
    <!-- Atom (Science) -->
    <ellipse cx="-45" cy="-30" rx="22" ry="9" fill="none" stroke="#3A86FF" stroke-width="2.5" transform="rotate(30 -45 -30)"/>
    <ellipse cx="-45" cy="-30" rx="22" ry="9" fill="none" stroke="#3A86FF" stroke-width="2.5" transform="rotate(-30 -45 -30)"/>
    <circle cx="-45" cy="-30" r="4" fill="#FFBE0B"/>
    <!-- Circuit (Tech) -->
    <path d="M30,-45 L50,-45 L65,-25 L65,-10" fill="none" stroke="#3A86FF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="30" cy="-45" r="4" fill="#8338EC"/>
    <circle cx="65" cy="-10" r="4" fill="#FFBE0B"/>
    <!-- Gear (Engineering) -->
    <circle cx="-45" cy="65" r="16" fill="none" stroke="#3A86FF" stroke-width="4" stroke-dasharray="6 4"/>
    <circle cx="-45" cy="65" r="6" fill="#8338EC"/>
    <!-- Palette / Pi (Art & Math) -->
    <path d="M35,65 Q55,45 65,65 Q60,85 45,75 Z" fill="#3A86FF"/>
    <circle cx="48" cy="62" r="3" fill="#D90429"/>
    <circle cx="56" cy="68" r="3" fill="#FFBE0B"/>
  </g>

  <!-- Bottom Text Banner -->
  <g filter="url(#softShadow)">
    <rect x="40" y="405" width="432" height="68" rx="20" fill="#D90429" stroke="url(#accentGrad)" stroke-width="2.5" />
    <text x="256" y="445" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="20" fill="#3A86FF" text-anchor="middle" letter-spacing="1.5">
      KINETIC INFINITY STEAM EMB
    </text>
    <text x="256" y="464" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#8338EC" text-anchor="middle" letter-spacing="3" opacity="0.9">
      TYPOGRAPHY & MONOGRAMS
    </text>
  </g>
</svg>